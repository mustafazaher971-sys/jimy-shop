<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>جيمي | شحن ألعاب أونلاين</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<meta charset="UTF-8">
    <title>جيمي | شحن ألعاب أونلاين</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="1.jpeg"> <!-- الصورة جنب التايتل -->
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Cairo", sans-serif;
}

body {
    background: #0b0b0b;
    color: #fff;
    direction: rtl;
}

/* ===== PROFILE ===== */
.profile {
    min-height: 100vh;
    text-align: center;
    padding: 80px 20px;
    background: radial-gradient(circle, #1a0000, #000);
}

.profile img {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    border: 4px solid #e10600;
    box-shadow: 0 0 30px rgba(225,6,0,.7);
    margin-bottom: 20px;
}

.profile h1 {
    font-size: 48px;
}

.tagline {
    color: #e10600;
    font-size: 18px;
    margin: 15px 0 30px;
}

.profile button {
    background: #e10600;
    color: #fff;
    border: none;
    padding: 12px 35px;
    font-size: 18px;
    border-radius: 30px;
    cursor: pointer;
    transition: .3s;
}

.profile button:hover {
    background: #fff;
    color: #000;
}

/* ===== SECTIONS ===== */
section {
    padding: 70px 15%;
    text-align: center;
}

.about p {
    font-size: 18px;
    line-height: 1.8;
    color: #ccc;
}

/* ===== CONTACT ===== */
.contact {
    background: #111;
}

.phones {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-top: 30px;
}

.phones a {
    background: #1b1b1b;
    padding: 15px;
    border-radius: 12px;
    text-decoration: none;
    color: #fff;
    transition: .3s;
}

.phones a:hover {
    background: #e10600;
}

/* ===== FOOTER ===== */
footer {
    background: #000;
    padding: 20px;
    text-align: center;
    color: #777;
}

/* ===== SOCIAL FLOAT ===== */
.social-float {
    position: fixed;
    left: 15px;
    bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 999;
}

.social-float a {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    color: #fff;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    box-shadow: 0 0 15px rgba(0,0,0,.5);
    transition: .3s;
}

.social-float a:hover {
    transform: scale(1.15);
}

.whatsapp { background: #25D366; }
.facebook { background: #1877F2; }
.instagram {
    background: radial-gradient(circle at 30% 107%,
    #fdf497 0%, #fdf497 5%, #fd5949 45%,
    #d6249f 60%, #285AEB 90%);
}
.tiktok { background: #000; }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
    section {
        padding: 60px 8%;
    }
    .profile h1 {
        font-size: 38px;
    }
}

</style>
<body>

<!-- ===== HERO / PROFILE ===== -->
<header class="profile">
    <img src="1.jpeg" alt="JIMY Shop">
    <h1>جيمي</h1>
    <p class="tagline">متجرك لشحن جميع الألعاب أونلاين</p>
    <button id="scrollBtn">تواصل معنا</button>
</header>

<!-- ===== ABOUT ===== -->
<section class="about">
    <h2>عن جيمي</h2>
    <p>
        جيمي شوب متخصص في شحن جميع الألعاب الأونلاين  
        بسرعة – أمان – أسعار منافسة  
        ونخدمك في أي وقت.
    </p>
</section>

<!-- ===== CONTACT ===== -->
<section class="contact" id="contact">
    <h2>📞 أرقام التواصل</h2>

    <div class="phones">
        <a href="tel:01099724584">01099724584</a>
        <a href="tel:01070497551">01070497551</a>
        <a href="tel:01080864172">01080864172</a>
        <a href="tel:01554498001">01554498001</a>
        <a href="tel:01119174653">01119174653</a>
    </div>
</section>

<!-- ===== FOOTER ===== -->
<footer>
    <p>© 2026 JIMY Shop - All Rights Reserved</p>
</footer>

<!-- ===== SOCIAL FLOAT ===== -->
<div class="social-float">
    <a href="https://whatsapp.com/channel/0029VbBtc2s1t90eSkCLeB2o" target="_blank" class="whatsapp">قناه الوتساب</a>
        <a href="https://chat.whatsapp.com/IPBHOLOhwYXGGcjFoqQXhR" target="_blank" class="whatsapp">جروب الوتس</a>

    <a href="https://www.facebook.com/share/1APdvtQ8of/" target="_blank" class="facebook">FB</a>
    <a href="https://www.instagram.com/jamy_______shop" target="_blank" class="instagram">IG</a>
    <a href="https://www.tiktok.com/@gmevv77" target="_blank" class="tiktok">TT</a>

</div>

<script src="script.js"></script>
<script>>
    // Scroll to contact
document.getElementById("scrollBtn").onclick = () => {
    document.getElementById("contact")
        .scrollIntoView({ behavior: "smooth" });
};

// Animate social buttons
const socials = document.querySelectorAll(".social-float a");
window.onload = () => {
    socials.forEach((btn, i) => {
        btn.style.transform = "translateX(-80px)";
        setTimeout(() => {
            btn.style.transform = "translateX(0)";
        }, i * 150);
    });
};

// Phone click effect
document.querySelectorAll(".phones a").forEach(phone => {
    phone.onclick = () => {
        phone.style.background = "#00c853";
        phone.innerText = "📞 جاري الاتصال...";
    };
});

</script>
</body>
</html>
